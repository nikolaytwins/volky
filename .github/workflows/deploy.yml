name: Deploy to hoster.by

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all assets including large video/PDF (~60 MB)"
        required: false
        default: false
        type: boolean

# Не отменять текущий деплой при новом push — иначе обрыв на середине
concurrency:
  group: deploy-volki-frn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to hoster.by (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == true && '1' || '0' }}
        run: |
          set -euo pipefail
          REMOTE="${FTP_DIR:-/www/volki-frn.by/}"
          REMOTE="${REMOTE%/}/"

          EXCLUDES=(
            --exclude .git/
            --exclude .github/
            --exclude .env
            --exclude .env.*
            --exclude DEPLOY.md
            --exclude UPLOAD-MANIFEST.txt
            --exclude deploy.sh
            --exclude .gitignore
            --exclude assets/analytics-head.html
          )

          if [ "$FULL_SYNC" != "1" ]; then
            EXCLUDES+=(
              --exclude-glob '**/partner-review.mp4'
              --exclude-glob '**/franchise.pdf'
              --exclude-glob '**/consulting.pdf'
              --exclude-glob '**/hero-loop.mp4'
            )
          fi

          run_lftp() {
            lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" <<LFTP
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set cmd:fail-exit true
          $1
          quit
          LFTP
          }

          # 1) Сначала критичные файлы (всегда перезаписать)
          echo "========== Phase 1: HTML, spasibo, JS =========="
          for attempt in 1 2 3; do
            if run_lftp "lcd $PWD
          cd ${REMOTE}
          put -O . index.html
          put -O . presentation.html
          put -O . privacy-policy.html
          put -O . spasibo.html
          mkdir -f spasibo
          cd spasibo
          lcd spasibo
          mput -O . index.html
          lcd $PWD
          cd ${REMOTE}assets
          lcd assets
          mput -O . qmagic.js fb-thank-you.js fb-pixel-config.js
          "; then
              echo "Phase 1 OK"
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 10
          done

          # 2) Остальные файлы (картинки и т.д.)
          echo "========== Phase 2: assets and images =========="
          for attempt in 1 2 3 4 5; do
            echo "========== Phase 2 attempt ${attempt}/5 =========="
            if run_lftp "lcd $PWD
          mirror -R --parallel=1 --only-newer --verbose \
            ${EXCLUDES[@]} \
            ./ ${REMOTE}"; then
              echo "Deploy succeeded"
              exit 0
            fi
            sleep 15
          done

          echo "Phase 2 failed after retries"
          exit 1
