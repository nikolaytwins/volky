name: Deploy to hoster.by

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all assets including large video/PDF (~60 MB)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-volki-frn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to hoster.by (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == true && '1' || '0' }}
        run: |
          set -euo pipefail
          REMOTE="${FTP_DIR:-/www/volki-frn.by/}"
          REMOTE="${REMOTE%/}/"

          if [[ "$REMOTE" != *volki-frn* ]]; then
            echo "::error::FTP_REMOTE_DIR must be /www/volki-frn.by/ (nginx docroot), not httpdocs. Got: ${REMOTE}"
            exit 1
          fi

          echo "Deploy target: ${REMOTE}/"

          echo "========== Phase 1: force HTML + spasibo + JS =========="
          for attempt in 1 2 3; do
            if lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" <<LFTP1
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set net:timeout 120
          set net:max-retries 5
          set cmd:fail-exit true
          set xfer:clobber on
          lcd $PWD
          cd ${REMOTE}
          put -O . index.html
          put -O . presentation.html
          put -O . privacy-policy.html
          put -O . spasibo.html
          mkdir -f spasibo
          put -O spasibo spasibo/index.html
          cd ${REMOTE}assets
          lcd assets
          put -O . qmagic.js
          put -O . fb-thank-you.js
          put -O . fb-pixel-config.js
          quit
          LFTP1
            then
              echo "Phase 1 OK"
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 10
          done

          if [ "$FULL_SYNC" = "1" ]; then
            MIRROR_EXCLUDES="-X .git/ -X .github/ -X DEPLOY.md -X UPLOAD-MANIFEST.txt -X deploy.sh -X .gitignore -X assets/analytics-head.html -X index.html -X presentation.html -X privacy-policy.html -X spasibo.html -X spasibo/"
            echo "========== Phase 2: full assets sync =========="
          else
            MIRROR_EXCLUDES="-X .git/ -X .github/ -X DEPLOY.md -X UPLOAD-MANIFEST.txt -X deploy.sh -X .gitignore -X assets/analytics-head.html -X index.html -X presentation.html -X privacy-policy.html -X spasibo.html -X spasibo/ -X assets/reviews/partner-review.mp4 -X assets/presentation/franchise.pdf -X assets/presentation/consulting.pdf -X assets/hero/hero-loop.mp4"
            echo "========== Phase 2: lite assets (skip large video/PDF) =========="
          fi

          for attempt in 1 2 3 4 5; do
            echo "========== Phase 2 attempt ${attempt}/5 =========="
            if lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" -e "set ftp:passive-mode true; set ftp:ssl-allow false; set net:timeout 120; set net:max-retries 5; set cmd:fail-exit true; set xfer:clobber on; lcd $PWD; mirror -R --parallel=1 --verbose ${MIRROR_EXCLUDES} ./ ${REMOTE}/; quit"; then
              echo "FTP upload finished"
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep 15
          done

      - name: Verify live site
        run: |
          set -euo pipefail
          BASE="http://volki-frn.by"
          echo "Checking ${BASE}/ ..."
          BODY=$(curl -sf --max-time 30 "${BASE}/")
          echo "$BODY" | grep -q 'A-frame дом и две бани' || {
            echo "::error::index.html on server is outdated (missing merged Veska block). Check FTP_REMOTE_DIR=/www/volki-frn.by/"
            exit 1
          }
          echo "Checking ${BASE}/spasibo/ ..."
          curl -sfI --max-time 30 "${BASE}/spasibo/" | grep -qi '200 OK' || {
            echo "::error::/spasibo/ not found on server"
            exit 1
          }
          echo "Live site OK"
