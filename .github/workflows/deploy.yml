name: Deploy to hoster.by

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all assets including large video/PDF (~60 MB)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-volki-frn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to hoster.by (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == true && '1' || '0' }}
        run: |
          set -euo pipefail
          LOCAL_BYTES=$(wc -c < index.html | tr -d ' ')
          MARKER_FILE="/tmp/index-marker.txt"
          grep -F 'A-frame дом и две бани' index.html > "$MARKER_FILE"

          # FTP home /www → сайт в volki-frn.by (секрет www/volki-frn.by тоже нормализуем)
          REMOTE="${FTP_DIR:-volki-frn.by}"
          REMOTE="${REMOTE#/}"
          REMOTE="${REMOTE#www/}"
          REMOTE="${REMOTE%/}"

          echo "Local index.html: ${LOCAL_BYTES} bytes"
          echo "FTP site path: ${REMOTE}/"

          if [ "$FULL_SYNC" = "1" ]; then
            MIRROR_EXCLUDES="-X .git/ -X .github/ -X .env -X .env.* -X .env.example -X DEPLOY.md -X UPLOAD-MANIFEST.txt -X deploy.sh -X .gitignore -X assets/analytics-head.html -X index.html -X presentation.html -X privacy-policy.html -X spasibo.html -X spasibo/"
          else
            MIRROR_EXCLUDES="-X .git/ -X .github/ -X .env -X .env.* -X .env.example -X DEPLOY.md -X UPLOAD-MANIFEST.txt -X deploy.sh -X .gitignore -X assets/analytics-head.html -X index.html -X presentation.html -X privacy-policy.html -X spasibo.html -X spasibo/ -X assets/reviews/partner-review.mp4"
          fi

          echo "========== Phase 1: HTML + spasibo + JS =========="
          for attempt in 1 2 3; do
            if lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" <<LFTP1
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set net:timeout 120
          set net:max-retries 5
          set cmd:fail-exit true
          set xfer:clobber on
          lcd $PWD
          cd ${REMOTE}
          put -O . index.html
          put -O . .htaccess
          put -O . presentation.html
          put -O . privacy-policy.html
          put -O . spasibo.html
          mkdir -f spasibo
          put -O spasibo/ spasibo/index.html
          mkdir -f assets/presentation
          put -O assets/presentation/ assets/presentation/consulting.pdf
          put -O assets/presentation/ assets/presentation/franchise.pdf
          mkdir -f assets/hero
          put -O assets/hero/ assets/hero/hero-loop.mp4
          put -O assets/hero/ assets/hero/hero-poster.jpg
          mkdir -f assets
          lcd assets
          put -O assets/ qmagic.js
          put -O assets/ fb-thank-you.js
          put -O assets/ fb-pixel-config.js
          lcd ..
          mkdir -f api
          put -O api/ api/lead.php
          quit
          LFTP1
            then break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 10
          done
          echo "Phase 1 OK"

          for attempt in 1 2 3 4 5; do
            echo "========== Phase 2 mirror attempt ${attempt}/5 =========="
            if lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" -e "set ftp:passive-mode true; set ftp:ssl-allow false; set net:timeout 120; set net:max-retries 5; set cmd:fail-exit true; set xfer:clobber on; lcd $PWD; cd ${REMOTE}; mirror -R --parallel=1 --verbose ${MIRROR_EXCLUDES} ./ .; quit"; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep 15
          done
          echo "Phase 2 OK"

          PROBE="/tmp/remote-index.html"
          rm -f "$PROBE"
          echo "========== FTP verify =========="
          lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" <<LFTP2
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set cmd:fail-exit true
          cd ${REMOTE}
          get index.html -o ${PROBE}
          quit
          LFTP2

          if [[ ! -f "$PROBE" ]]; then
            echo "::error::Could not download index.html from FTP path ${REMOTE}/"
            exit 1
          fi
          REMOTE_BYTES=$(wc -c < "$PROBE" | tr -d ' ')
          echo "Remote index.html: ${REMOTE_BYTES} bytes (local ${LOCAL_BYTES})"
          if [[ "$REMOTE_BYTES" -lt 168000 ]]; then
            echo "::error::Remote index.html too small; check FTP_REMOTE_DIR=volki-frn.by (FTP home /www)"
            exit 1
          fi
          if ! grep -qF -f "$MARKER_FILE" "$PROBE"; then
            echo "::error::Remote index.html missing expected content"
            exit 1
          fi
          for PDF in assets/presentation/consulting.pdf assets/presentation/franchise.pdf; do
            REMOTE_PDF="/tmp/remote-$(basename "$PDF")"
            lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" <<LFTP3
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set cmd:fail-exit true
          cd ${REMOTE}
          get ${PDF} -o ${REMOTE_PDF}
          quit
          LFTP3
            LOCAL_PDF_BYTES=$(wc -c < "$PDF" | tr -d ' ')
            REMOTE_PDF_BYTES=$(wc -c < "$REMOTE_PDF" | tr -d ' ')
            echo "${PDF}: local ${LOCAL_PDF_BYTES} / remote ${REMOTE_PDF_BYTES}"
            if [[ "$REMOTE_PDF_BYTES" -ne "$LOCAL_PDF_BYTES" ]]; then
              echo "::error::${PDF} size mismatch on FTP"
              exit 1
            fi
          done
          echo "FTP verify OK"

      - name: Verify live site
        run: |
          set -euo pipefail
          BASE="https://volki-frn.by"
          UA="Mozilla/5.0 (compatible; VolkiDeployCheck/1.0)"
          MARKER='A-frame дом и две бани'
          for i in 1 2 3 4 5 6; do
            echo "HTTP check ${i}/6 ..."
            BODY=$(curl -sL --max-time 30 -A "${UA}" -H "Accept: text/html" "${BASE}/index.html" || true)
            if grep -qF "${MARKER}" <<< "${BODY}"; then
              SPASIBO_HEADERS=$(curl -sIL --max-time 30 -A "${UA}" "${BASE}/spasibo/" || true)
              if grep -qE 'HTTP/[0-9.]+ 200' <<< "${SPASIBO_HEADERS}"; then
                echo "Live site OK"
                exit 0
              fi
              echo "::error::/spasibo/ not found"
              exit 1
            fi
            sleep 10
          done
          echo "::error::HTTP still shows old index. Plesk docroot must be /www/volki-frn.by and FTP path volki-frn.by"
          exit 1
