name: Deploy to hoster.by

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all assets including large video/PDF (~60 MB)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-volki-frn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to hoster.by (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == true && '1' || '0' }}
        run: |
          set -euo pipefail
          LOCAL_INDEX="$PWD/index.html"
          LOCAL_BYTES=$(wc -c < "$LOCAL_INDEX" | tr -d ' ')

          normalize_path() {
            local p="${1#/}"
            p="${p%/}"
            [[ -z "$p" || "$p" == "." ]] && echo "." || echo "$p"
          }

          PRIMARY="$(normalize_path "${FTP_DIR:-www/volki-frn.by}")"
          # hoster.by: nginx часто смотрит в httpdocs, а FTP — в www/volki-frn.by (или наоборот)
          DEPLOY_PATHS=()
          for p in "$PRIMARY" "httpdocs" "www/volki-frn.by" "."; do
            n="$(normalize_path "$p")"
            skip=0
            for existing in "${DEPLOY_PATHS[@]:-}"; do
              [[ "$existing" == "$n" ]] && skip=1 && break
            done
            [[ "$skip" -eq 0 ]] && DEPLOY_PATHS+=("$n")
          done

          echo "Local index.html: ${LOCAL_BYTES} bytes"
          echo "Deploy paths: ${DEPLOY_PATHS[*]}"

          if [ "$FULL_SYNC" = "1" ]; then
            MIRROR_EXCLUDES="-X .git/ -X .github/ -X .env -X .env.* -X .env.example -X DEPLOY.md -X UPLOAD-MANIFEST.txt -X deploy.sh -X .gitignore -X assets/analytics-head.html -X index.html -X presentation.html -X privacy-policy.html -X spasibo.html -X spasibo/"
            echo "Phase 2 mode: full assets"
          else
            MIRROR_EXCLUDES="-X .git/ -X .github/ -X .env -X .env.* -X .env.example -X DEPLOY.md -X UPLOAD-MANIFEST.txt -X deploy.sh -X .gitignore -X assets/analytics-head.html -X index.html -X presentation.html -X privacy-policy.html -X spasibo.html -X spasibo/ -X assets/reviews/partner-review.mp4 -X assets/presentation/franchise.pdf -X assets/presentation/consulting.pdf -X assets/hero/hero-loop.mp4"
            echo "Phase 2 mode: lite assets"
          fi

          deploy_path() {
            local REMOTE="$1"
            local cd_cmd="cd ${REMOTE}"
            [[ "$REMOTE" == "." ]] && cd_cmd="true"

            echo "========== Deploy to: ${REMOTE} =========="
            lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" <<LFTP1
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set net:timeout 120
          set net:max-retries 5
          set cmd:fail-exit true
          set xfer:clobber on
          lcd $PWD
          pwd
          ${cd_cmd}
          pwd
          put -O . index.html
          put -O . presentation.html
          put -O . privacy-policy.html
          put -O . spasibo.html
          mkdir -f spasibo
          put -O spasibo/ spasibo/index.html
          mkdir -f assets
          lcd assets
          put -O assets/ qmagic.js
          put -O assets/ fb-thank-you.js
          put -O assets/ fb-pixel-config.js
          quit
          LFTP1

            for attempt in 1 2 3; do
              echo "Mirror ${REMOTE} attempt ${attempt}/3"
              if lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" -e "set ftp:passive-mode true; set ftp:ssl-allow false; set net:timeout 120; set net:max-retries 5; set cmd:fail-exit true; set xfer:clobber on; lcd $PWD; mirror -R --parallel=1 --verbose ${MIRROR_EXCLUDES} ./ ${REMOTE}; quit"; then
                break
              fi
              [[ "$attempt" -eq 3 ]] && return 1
              sleep 10
            done

            local probe="/tmp/remote-index-$$.html"
            local get_cd="cd ${REMOTE};"
            [[ "$REMOTE" == "." ]] && get_cd=""
            lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_SERVER}" -e "set ftp:passive-mode true; set ftp:ssl-allow false; set cmd:fail-exit true; ${get_cd} get -o ${probe} index.html; quit"
            local remote_bytes
            remote_bytes=$(wc -c < "$probe" | tr -d ' ')
            if grep -q 'A-frame дом и две бани' "$probe"; then
              echo "FTP OK at ${REMOTE}: index ${remote_bytes} bytes, marker found"
              echo "$REMOTE" >> /tmp/deploy-hit-path.txt
              rm -f "$probe"
              return 0
            fi
            echo "FTP at ${REMOTE}: index ${remote_bytes} bytes (expected ${LOCAL_BYTES}), marker missing"
            rm -f "$probe"
            return 1
          }

          rm -f /tmp/deploy-hit-path.txt
          FTP_OK=0
          for REMOTE in "${DEPLOY_PATHS[@]}"; do
            if deploy_path "$REMOTE"; then
              FTP_OK=1
            fi
          done

          if [[ "$FTP_OK" -eq 0 ]]; then
            echo "::error::index.html not updated on FTP in any of: ${DEPLOY_PATHS[*]}. In Plesk set FTP home to site docroot."
            exit 1
          fi
          echo "FTP paths with fresh index: $(tr '\n' ' ' < /tmp/deploy-hit-path.txt)"

      - name: Verify live site
        run: |
          set -euo pipefail
          BASE="http://volki-frn.by"
          for i in 1 2 3 4 5 6; do
            echo "HTTP check attempt ${i}/6 ..."
            BODY=$(curl -s --max-time 30 "${BASE}/" || true)
            if echo "$BODY" | grep -q 'A-frame дом и две бани'; then
              curl -sI --max-time 30 "${BASE}/spasibo/" | grep -qi '200 OK' || {
                echo "::error::/spasibo/ not found on server"
                exit 1
              }
              echo "Live site OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Site still shows old index.html. In Plesk align Document root with FTP (see 'FTP paths with fresh index' in deploy log)."
          exit 1
